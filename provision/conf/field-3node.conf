# ============================================================================
# 现场集群（2026-09 实例）：admin + gpu02 + gpu03，各 1×RTX 3060，sshd 2180
#   cpus / mem_mb 取自各机 `slurmd -C` 实测（见 oa/config-snapshot/nodes.txt）
#   用途：拿它渲染一遍，与 admin 上的真实 /etc/{hosts,slurm/{slurm,gres}.conf,exports,fstab}
#         逐项对照，验证生成器正确性。见 provision/README.md「自检」一节。
# ============================================================================
CLUSTER_NAME=lab
ACCOUNT=lab

LAN_CIDR=10.71.106.0/24
SSH_PORT=2180
TIMEZONE=Asia/Shanghai
OPS_USER=lab

SHARE_DEVICE=/dev/sda
SHARE_MOUNT=/share
IMAGES_DEVICE=
IMAGES_MOUNT=/share/images

SLURM_VERSION=26.05.1
PARTITION=gpu
GRES_MODE=auto
GPU_PREFIX=RTX
PORTAL_PORT=8000

NODE admin=10.71.106.239  role=mgr,gpu  gpus=1  gpu_model=3060  cpus=16  mem_mb=31933  sockets=1  threads=2
NODE gpu02=10.71.106.252  role=gpu      gpus=1  gpu_model=3060  cpus=16  mem_mb=31933  sockets=1  threads=2
NODE gpu03=10.71.106.249  role=gpu      gpus=1  gpu_model=3060  cpus=16  mem_mb=128653  sockets=1  threads=2
