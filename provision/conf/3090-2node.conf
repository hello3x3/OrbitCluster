# ============================================================================
# 3090 集群（第二套实例）：3090-01（管理+计算）+ 3090-03（计算），各 3×RTX 3090
#   sshd 2022；/share 在 sdb；/share/images 是**独立 NVMe 文件系统**（单独导出+挂载）
#   用途：验证生成器能覆盖「双盘导出 / 多卡套餐 / 非标准 ssh 端口」
#   对照物：oa/sites/3090-2node/{slurm.conf,gres.conf,site.conf,host-config/}
# ============================================================================
CLUSTER_NAME=lab
ACCOUNT=lab

LAN_CIDR=10.130.136.0/24
SSH_PORT=2022
TIMEZONE=Asia/Shanghai
USER=lab

SHARE_DEVICE=/dev/sdb
SHARE_MOUNT=/share
IMAGES_DEVICE=UUID=bd1d9669-0a71-4b63-bb44-9c9eb80fc723
IMAGES_MOUNT=/share/images

SLURM_VERSION=26.05.1
PARTITION=gpu
GRES_MODE=explicit
GPU_PREFIX=RTX
PORTAL_PORT=8000

NODE 3090-01=10.130.136.181  role=mgr,gpu  gpus=3  gpu_model=3090  cpus=40  mem_mb=128550  sockets=2  threads=2
NODE 3090-03=10.130.136.183  role=gpu      gpus=3  gpu_model=3090  cpus=36  mem_mb=128492  sockets=1  threads=2
