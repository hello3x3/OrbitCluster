# ============================================================================
# /etc/ssh/sshd_config.d/10-portal-only.conf —— 由 provision/render.sh 生成
# 目标：**每个节点**都放这一份，然后 `systemctl reload ssh`
#
# 为什么必须有它（否则门户的产品模型不成立）：
#   门户把用户登记的 SSH 公钥写进他自己的 ~/.ssh/authorized_keys —— 那是给
#   **容器内** sshd 用的。但家目录在 NFS 上、各节点都导出，而宿主机的 sshd 读的
#   也是同一个 `AuthorizedKeysFile .ssh/authorized_keys`。不做白名单的话，用户
#   拿容器那把私钥就能 `ssh -p @@SSH_PORT@@ <自己>@<节点>` 登上宿主机，
#   进而用 PATH 里的 sbatch/srun 绕过全部门户策略（套餐/时长/镜像白名单/端口池）。
#
# 为什么不能用「把用户 shell 改成 nologin」代替：
#   enroot 的 passwd hook 会把宿主机的 passwd 条目（含 shell）复制进容器，
#   改成 nologin 会让**容器里也登不进去**。边界只能落在 sshd 配置上。
#
# 容器不受影响：容器内 sshd 读的是镜像自带的 sshd_config，且只挂 $HOME。
# ============================================================================
AllowUsers root
# root 有可用口令，仅 AllowUsers 挡不住针对 root 的口令爆破；prohibit-password = 只认密钥
PermitRootLogin prohibit-password
