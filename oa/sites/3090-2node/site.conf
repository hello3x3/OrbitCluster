# ============================================================================
# OrbitCluster 站点配置 —— 3090-2node
#   目标位置：/etc/cluster-portal/site.conf
#   读取方：portalapp/siteconf.py（门户进程）与 deploy/portal-ctl（root 助手）
#   格式：每行 KEY=VALUE，# 起注释，键名大小写不敏感
#   优先级：环境变量 PORTAL_<KEY> > 本文件 > 代码内置默认值
# ============================================================================

# 节点间 ssh 端口。本集群 sshd 在 2022（非标准 22）；
# 门户特权助手据此 ssh/scp 到各计算节点执行建号、提交、保存镜像等动作。
# 注意：该端口同时会被自动加入「用户不可申请的保留端口」列表（见 portalapp/db.py）。
SSH_PORT=2022

# gres 型号 token -> 界面展示名。纯数字 token 本来就会自动补 "RTX " 前缀
# （gpu:3090 -> RTX 3090），这里显式写出只为可读性与将来改名方便。
GPU_MODEL_MAP=3090:RTX 3090

# 集群信息不可用（slurmctld 未起/查询失败）时的兜底 GPU 型号。
DEFAULT_GPU_MODEL=RTX 3090

# Slurm 会计账户名（sacctmgr account）。用户必须在这个账户下有关联，否则在
# AccountingStorageEnforce=associations 的集群上 sbatch 会被拒：
#   Invalid account or account/partition combination specified
# portal-ctl 会在开通/初始化/提交前幂等补齐该关联（见 _ensure_assoc）；
# 「OS 账号已存在」这条开通路径不走 add-user.sh，历史上就是在这里漏掉的。
# 与 base-cluster/scripts/cluster-admin/add-user.sh 的 CLUSTER_ACCOUNT 保持一致。
ACCOUNT=lab

# 首次建库时的套餐种子。留空则用与机型无关的内置套餐 + 上面的默认型号。
SEED_PLANS=/etc/cluster-portal/plans.json
