# ============================================================================
# OrbitCluster 站点 gres.conf —— 3090-2node（每节点 3× RTX 3090）
#
# 这里【显式】声明三张卡，而不是用 `AutoDetect=nvml`，原因：
#   AutoDetect=nvml 推导出的类型是设备名清洗后的结果 —— 实测为
#   `nvidia_geforce_rtx_3090`，而不是 `3090`。它有两个副作用：
#     ① slurm.conf 的 NodeName Gres= 必须逐字对齐，否则节点 IDLE+DRAIN+INVALID_REG；
#     ② 门户的 GPU 型号下拉会显示成 nvidia_geforce_rtx_3090。
#   显式写 Type=3090 后，两侧按构造一致，sinfo 显示 gpu:3090:3。
#
# ⚠️ 换卡 / 增减卡数时，本文件与 slurm.conf 的 NodeName Gres= 必须同步改。
# ============================================================================
Name=gpu Type=3090 File=/dev/nvidia0
Name=gpu Type=3090 File=/dev/nvidia1
Name=gpu Type=3090 File=/dev/nvidia2
