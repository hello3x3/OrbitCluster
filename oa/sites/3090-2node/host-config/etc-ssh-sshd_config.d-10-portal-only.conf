# OrbitCluster —— 门户模式下禁止集群用户登录宿主机
#
# 目标位置：/etc/ssh/sshd_config.d/10-portal-only.conf（每个节点都要放）
# 安装方式与验收命令见 base-cluster/all-in-one-cluster-manual.md 第 1.7 节。
#
# 背景（为什么必须有这个文件）：
#   门户把用户登记的 SSH 公钥写进他自己的 `~/.ssh/authorized_keys`，用于登录
#   **容器内**的 sshd（容器里由 /opt/start_ssh.sh 起 sshd，端口是用户申请的 ≥10000）。
#   但家目录在 NFS 上、三台节点都导出，而宿主机的 sshd 也读同一个
#   `AuthorizedKeysFile .ssh/authorized_keys` —— 于是用户拿同一把私钥就能
#   `ssh -p 2180 <自己>@<节点>` 直接登录宿主机，进而用 PATH 里的 sbatch/srun
#   绕过全部门户策略（套餐、时长、镜像白名单、端口池）。
#
# 为什么不是把用户的 shell 改成 /usr/sbin/nologin：
#   enroot 的 passwd hook 会把宿主机的 passwd 条目（含 shell）复制进容器，
#   改成 nologin 会让**容器里也登不进去**。边界只能落在 sshd 配置上。
#
# 为什么容器不受影响：
#   容器内的 sshd 读的是镜像自带的 /etc/ssh/sshd_config（与宿主机这份无关），
#   且只 bind-mount 了 $HOME；宿主机配置不进入容器。

AllowUsers root

# root 有可用口令且默认 PasswordAuthentication yes，仅靠 AllowUsers 挡不住
# 针对 root 的口令爆破；prohibit-password 表示 root 只能用密钥。
PermitRootLogin prohibit-password
