{% extends "base.html" %}
{% block title %}{{ code }} - {{ portal_name }}{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand"><span class="dot"></span>{{ portal_name }}</div>
  <h1>{{ code }}</h1>
  <p>{{ msg }}</p>
  <p><a class="btn btn-primary" href="{{ url_for('home') }}">返回首页</a></p>
</div>
{% endblock %}
