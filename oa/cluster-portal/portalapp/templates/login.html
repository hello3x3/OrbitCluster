{% extends "base.html" %}
{% block title %}登录 - {{ portal_name }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>用户登录</h1>
  <p class="muted">新用户需由管理员开通账号后，凭初始密码登录。</p>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>用户名
      <input name="username" required autofocus autocomplete="username">
    </label>
    <label>密码
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary" type="submit">登 录</button>
  </form>
</div>
{% endblock %}
