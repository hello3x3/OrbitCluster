name: Native OrbitCluster CLI
on:
  push:
    branches: [codex/frontend-optimization]
    paths: ['terminal/**', '.github/workflows/terminal-cli.yml']
  pull_request:
    paths: ['terminal/**', '.github/workflows/terminal-cli.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux, arch: amd64}
          - {runner: ubuntu-22.04-arm, platform: linux, arch: arm64}
          - {runner: macos-15, platform: darwin, arch: arm64}
          - {runner: macos-15-intel, platform: darwin, arch: amd64}
          - {runner: windows-2022, platform: windows, arch: amd64}
          - {runner: windows-11-arm, platform: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./...
      - run: go run ./cmd/release --target ${{ matrix.platform }}/${{ matrix.arch }} --output ../cli-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.platform }}-${{ matrix.arch }}
          path: cli-artifacts/
